syntax = "proto3";

package discord_protos.qos_token.v1;

message QosToken {
  message ClientProvidedQosData {
    bool is_active = 1;
  }

  message DerivedQosData {
    bytes claims = 1;
    bytes signature = 2;
    uint32 key_id = 3;
  }

  optional ClientProvidedQosData client_provided = 1;
  optional DerivedQosData derived = 2;
}
